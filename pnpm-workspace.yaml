packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.13'
  - '@expo/router-server@58.0.15'
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo@58.0.16
# Both ship prebuilt binaries; their install scripts are not needed.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
